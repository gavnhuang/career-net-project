# Study question-sampling configuration.
# All paths are relative to the project root (04 R Project/). Run every script from there.

# ---- Pre-registration guard --------------------------------------------------
# 04 and 05 run in DRY-RUN mode unless BOTH are set. Set them only after the
# OSF pre-registration is posted.
preregistration_posted: false
osf_url: ""
# The real draw's seed comes from this string (see doi_seed()). It is normalized
# before hashing (trimmed, lowercased, "https://doi.org/" / "doi:" prefix dropped).
# A real run refuses to start while it is empty.
osf_doi: ""

# ---- Seeds -------------------------------------------------------------------
# master_seed drives the frame, reading sample, reserved sets, human-answer pick
# and every dry run. The REAL study draw (draw, inclusion reps, replacement
# queues) uses study_master_seed = doi_seed(osf_doi) instead.
master_seed: 20261027

# ---- Inputs (read-only) ------------------------------------------------------
frame_version: "v1.1"
inputs:
  primary: "../03 CareerNet Data/Datasets/v1.1/general_public_v1.1.csv"
  previous: "../03 CareerNet Data/Datasets/general_public.csv"
  previous_version: "v1.0"
  documentation: "../03 CareerNet Data/Data-Details v1.1.pdf"
  anchor_exclusions: "pilot/anchor_check_key.csv"
  # Stays empty (headers only): the reading sample was used to write exclusion rules;
  # rule 1 is applied to the frame automatically and rules 2-4 by screening the drawn
  # sample (05). There are no manual frame exclusions.
  manual_exclusions: "study/config/exclusions.csv"

# ---- Outputs -----------------------------------------------------------------
paths:
  frame_dir: "study/data/01_frame"
  reserved_dir: "study/data/02_reserved"
  sample_dir: "study/data/03_sample"
  reports_dir: "study/reports"
  logs_dir: "study/logs"

# ---- Step 1: eligibility -----------------------------------------------------
filters:
  # a. answer posted on or after answer_date_min and before answer_date_max_exclusive (UTC).
  #    Human answers from spring 2023 on show signs of AI-assisted writing.
  answer_date_min: "2021-01-01"
  answer_date_max_exclusive: "2023-03-01"
  answer_min_words: 40        # b. answer word count, inclusive
  answer_max_words: 600
  question_min_words: 10      # c. title + body word count, inclusive
  # unclear_goal is NOT a filter (D87): "Unclear Goal" questions stay in the frame.
  # d. exclusion rule 1: prompts written by CareerVillage, not by a real asker.
  #    Matched case-insensitively against title + body with HTML stripped.
  platform_prompt_pattern: 'Note:\s*(We''ve seen a lot of interest in this career|Given the growing interest in the|this (question )?is part of (our|the) professionals series)'
# Counts that steps all, a, b, c, d (rule 1), e (anchor check), f (manual exclusions) must
# reproduce exactly; 01 stops otherwise.
expected_attrition:
  questions: [3000, 764, 725, 707, 707, 694, 694]
  answers: [7984, 1496, 1338, 1301, 1301, 1278, 1278]

# ---- Step 2: reading sample --------------------------------------------------
reading_sample_n: 45

# ---- Step 3: reserved sets (drawn in this order) -----------------------------
reserved_sets:
  - {name: pilot,           size: 16, n_human: 8,  n_ai: 8}
  - {name: warmups,         size: 6,  n_human: 3,  n_ai: 3}
  - {name: calibration,     size: 15, n_human: 8,  n_ai: 7}
  - {name: gold_candidates, size: 20, n_human: 10, n_ai: 10}

# ---- Step 4: study draw ------------------------------------------------------
# D88: draw 100; the study uses the first k in draw order (k, expected 90, set after the
# pilot and the rater headcount; see select_first_k()).
study_n: 100
floor: 3
inclusion_reps: 10000
target_words_tolerance: 0.20

# ---- Display cleaning -------------------------------------------------------
# A final line of a human answer that is ONLY one or more of these phrases (any case,
# optional punctuation, optionally followed by a name) is removed as a closing.
# Never removed inside a longer sentence or anywhere but the last line.
closing_pleasantries:
  - "hope this helps"
  - "i hope this helps"
  - "hope that helps"
  - "i hope that helps"
  - "hope this is helpful"
  - "i hope this is helpful"
  - "good luck"
  - "good luck to you"
  - "best of luck"
  - "best of luck to you"
  - "all the best"
  - "all the best to you"
  - "all my best"
  - "wishing you the best"
  - "wishing you all the best"
  - "wishing you the best of luck"

# Fixed by name; chosen by the rule "30+ eligible questions (10 x floor) in the frame".
# 01 stops if the rule no longer gives exactly this set. First Job Navigation has exactly 30.
guaranteed_labels:
  - "Industry-Specific Knowledge and Trends"
  - "Career Decision-Making, Transitioning, and Exploration Resources"
  - "College Queries"
  - "Job Search Strategies and Infrastructure"
  - "Work-Life Balance and Personal Values Alignment"
  - "Resume/CV/LinkedIn Optimization and Personal Branding"
  - "Networking and Mentorship"
  - "Skill Development"
  - "First Job Navigation"
guaranteed_rule_multiplier: 10   # 01 checks guaranteed_labels == labels with >= multiplier x floor questions

# The full CareerNet scenario label vocabulary (18). Any other label in the data is an error.
scenario_labels:
  - "Industry-Specific Knowledge and Trends"
  - "Career Decision-Making, Transitioning, and Exploration Resources"
  - "College Queries"
  - "Job Search Strategies and Infrastructure"
  - "Work-Life Balance and Personal Values Alignment"
  - "Resume/CV/LinkedIn Optimization and Personal Branding"
  - "Skill Development"
  - "Networking and Mentorship"
  - "First Job Navigation"
  - "Freelancing/Self-Employment/Entrepreneurship"
  - "Interview Preparation"
  - "Non-Degree Certifications/Credentials"
  - "Workplace Dynamics"
  - "International Careers"
  - "Barriers, Equity, and Resource Considerations"
  - "Job Offers and Negotiations"
  - "Career Advancement"
  - "Mid-Career Pivots"

